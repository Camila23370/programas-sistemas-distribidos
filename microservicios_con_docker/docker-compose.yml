# formato de configuración yml
# le decimos a docker de como interpretar los archivos 
version: "3"
services:
  user_service:
    build: ./user_service
    ports:
      - "5001:5001" # en que puerto decimos que se ejecute 
        # 1er puerto: cotenedor  2do port: máquina anfitriona 
  product_service:
    build: ./product_service
    ports:
      - "5002:5002"

  order_service:
    build: ./order_service
    ports:
      - "5003:5003"
    depends_on:
      - user_service
      - product_service
