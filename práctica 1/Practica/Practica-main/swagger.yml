swagger: "2.0"
info:
  title: API de Datos Ambientales
  description: Consulta datos ambientales recolectados por sensores urbanos.
  version: "1.0.0"
host: localhost:5002 # la API se ejecuta en el puerto 5002
basePath: / # la raíz de la API
schemes:
  - http # protocolo usado para acceder a la API
paths:
  /collector/{barrio_id}: # obtiene los últimos datos de un barrio
    get: # el método GET solo pide la información, solo lee
      summary: Últimos datos ambientales por tipo en un barrio
      parameters:
        - name: barrio_id
          in: path
          required: true
          type: string
          description: Nombre del barrio (ej. condesa)
      responses:
        200:
          description: Datos ambientales más recientes por tipo
          schema:
            type: array
            items:
              $ref: '#/definitions/DatoAmbiental'
        404:
          description: Barrio no encontrado o sin datos

  /storage: # obtiene todos los datos almacenados agrupados por barrio 
    get:
      summary: Obtener todos los datos almacenados por barrio
      responses:
        200:
          description: Datos agrupados por barrio
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/definitions/DatoAmbiental'

  /alert: # consulta las alertas ambientales registradas
    get: # pide información
      summary: Consultar alertas ambientales registradas
      responses:
        200:
          description: Lista de alertas
          schema:
            type: array
            items:
              $ref: '#/definitions/AlertaAmbiental'

definitions:
  DatoAmbiental:
    type: object
    properties:
      barrio_id:
        type: string
      tipo:
        type: string
        enum: [temperatura, humedad, calidad_aire]
      valor:
        type: number
      timestamp:
        type: string
        format: date-time

  AlertaAmbiental:
    type: object
    properties:
      barrio_id:
        type: string
      tipo:
        type: string
      valor:
        type: number
      mensaje:
        type: string
# en este archivo contiene el nombre, versión y dirección de la API
# puerto donde se ejecuta y la raíz de la API
# tenemos las rutas disponibles y que es lo que hace cada una 
# explica como se va a interactuar, que es lo que se solicita y que se va a recibir a cambio
# 200 todo con éxito 
# 404 error
# POST envia o crea información
# esta API solo esta diseñada para consultar información únicamente 